name: Daily Build & Release

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      release:
        description: 'Target Distribution & Release'
        required: true
        default: 'noble'
        type: choice
        options:
          - noble
          - jammy
          - focal
          - bookworm
          - trixie
          - bullseye
          - sid
          - arch
      flavour:
        description: 'Flavour / Edition'
        required: true
        default: 'minimal'
        type: choice
        options:
          - minimal
          - server
          - desktop-xfce
          - desktop-gnome
          - desktop-mate
      target_storage:
        description: 'Target Storage Medium'
        required: true
        default: 'sd'
        type: choice
        options:
          - sd
          - nvme
          - both
      tag_name:
        description: 'Custom release tag (leave empty for daily / tag trigger)'
        required: false
        default: ''
      reuse_run_id:
        description: 'Optional: Existing run ID to release (skips rebuild)'
        required: false
        default: ''
      publish_release:
        description: 'Publish or update GitHub release'
        required: true
        default: true
        type: boolean
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'patch/**'
      - 'config/**'
      - 'boot/**'
      - '.github/workflows/daily.yml'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Orange Pi 4 Pro OS Image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for upstream kernel updates
        id: check-kernel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_skip=false" >> $GITHUB_OUTPUT
            echo "Manual or push event detected (${{ github.event_name }}). Proceeding with build."
            exit 0
          fi

          echo "Checking upstream kernel commit on branch linux-6.18.y..."
          UPSTREAM_KERNEL=$(git ls-remote https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git refs/heads/linux-6.18.y | awk '{print $1}')
          LOCAL_REPO_SHA="${GITHUB_SHA}"

          echo "Upstream Linux 6.18 HEAD: ${UPSTREAM_KERNEL}"
          echo "Current Repository HEAD:   ${LOCAL_REPO_SHA}"

          TAG="${{ github.event.inputs.tag_name || 'daily' }}"
          RELEASE_BODY=$(gh release view "$TAG" --repo "$GH_REPO" --json body -q .body 2>/dev/null || true)

          BUILD_STAMP="BUILD_STAMP: KERNEL=${UPSTREAM_KERNEL} REPO=${LOCAL_REPO_SHA}"
          if echo "$RELEASE_BODY" | grep -Fq "$BUILD_STAMP"; then
            echo "should_skip=true" >> $GITHUB_OUTPUT
            echo "### ⏭️ Clean Exit: No New Kernel Changes" >> $GITHUB_STEP_SUMMARY
            echo "Upstream kernel (\`${UPSTREAM_KERNEL:0:12}\`) and repository (\`${LOCAL_REPO_SHA:0:12}\`) have not changed since last build." >> $GITHUB_STEP_SUMMARY
            echo "Cleanly skipping build to save CI minutes." >> $GITHUB_STEP_SUMMARY
          else
            echo "should_skip=false" >> $GITHUB_OUTPUT
            echo "New kernel commit or repository changes detected. Proceeding with build."
          fi

      - name: Free disk space on runner
        if: steps.check-kernel.outputs.should_skip != 'true' && github.event.inputs.reuse_run_id == ''
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true
          df -h

      - name: Install build dependencies
        if: steps.check-kernel.outputs.should_skip != 'true' && github.event.inputs.reuse_run_id == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git make gcc g++ gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            bison flex bc libssl-dev libncurses-dev libelf-dev \
            debootstrap qemu-user-static binfmt-support u-boot-tools rsync cpio \
            kmod parted dosfstools fdisk xz-utils curl wget zstd pigz python3 \
            device-tree-compiler dialog lzop libyaml-dev pkg-config libarchive-tools

      - name: Clone build harness
        if: steps.check-kernel.outputs.should_skip != 'true' && github.event.inputs.reuse_run_id == ''
        run: |
          git clone --depth 1 https://github.com/orangepi-xunlong/orangepi-build.git orangepi-build

      - name: Apply Orange Pi 4 Pro A733 patches and configuration
        if: steps.check-kernel.outputs.should_skip != 'true' && github.event.inputs.reuse_run_id == ''
        run: |
          # Apply orangepi-build harness patch
          git -C orangepi-build apply ../patch/orangepi-build.patch

          # Copy unified mainline kernel patch & builddeb packaging patch

          # Copy unified mainline kernel patch & builddeb packaging patch
          mkdir -p orangepi-build/external/patch/kernel/sun60iw2-next
          cp patch/0001-allwinner-a733-orangepi-4-pro-6.18-mainline.patch orangepi-build/external/patch/kernel/sun60iw2-next/
          cp patch/0300-packaging-armbian-builddeb.patch orangepi-build/external/patch/kernel/sun60iw2-next/
          [ -f patch/0210-a733-orangepi-4-pro-rgmii-delay.patch ] && cp patch/0210-a733-orangepi-4-pro-rgmii-delay.patch orangepi-build/external/patch/kernel/sun60iw2-next/
          [ -f patch/0215-workqueue-guard-null-task-kick-pool.patch ] && cp patch/0215-workqueue-guard-null-task-kick-pool.patch orangepi-build/external/patch/kernel/sun60iw2-next/
          cp patch/0003-allwinner-a733-cedrus-vpu-support.patch orangepi-build/external/patch/kernel/sun60iw2-next/

          # Copy U-Boot A733 boot patches (NVMe + defconfig + board DTS)
          mkdir -p orangepi-build/external/patch/u-boot/u-boot-sunxi
          cp patch/u-boot/u-boot-sunxi/*.patch orangepi-build/external/patch/u-boot/u-boot-sunxi/

          # Copy modular defconfig
          mkdir -p orangepi-build/external/config/kernel
          cp config/orangepi_4pro_defconfig orangepi-build/external/config/kernel/linux-sun60iw2-next-a733.config

          # Copy desktop and hardware integration overlays (including initramfs device discovery hooks)
          mkdir -p orangepi-build/external/packages/bsp/common
          cp -rv overlay/* orangepi-build/external/packages/bsp/common/

      - name: Build SD Image (Ubuntu / Debian Stack)
        if: steps.check-kernel.outputs.should_skip != 'true' && github.event.inputs.reuse_run_id == '' && github.event.inputs.release != 'arch'
        run: |
          RELEASE="${{ github.event.inputs.release }}"
          [ -z "$RELEASE" ] && RELEASE="noble"

          FLAVOUR="${{ github.event.inputs.flavour }}"
          [ -z "$FLAVOUR" ] && FLAVOUR="minimal"

          BUILD_MINIMAL="no"
          BUILD_DESKTOP="no"
          DESKTOP_ENV_ARGS=""

          case "$FLAVOUR" in
            minimal)
              BUILD_MINIMAL="yes"
              BUILD_DESKTOP="no"
              ;;
            server)
              BUILD_MINIMAL="no"
              BUILD_DESKTOP="no"
              ;;
            desktop-xfce)
              BUILD_MINIMAL="no"
              BUILD_DESKTOP="yes"
              DESKTOP_ENV_ARGS="DESKTOP_ENVIRONMENT=xfce DESKTOP_ENVIRONMENT_CONFIG_NAME=config_base DESKTOP_APPGROUPS_SELECTED="
              ;;
            desktop-gnome)
              BUILD_MINIMAL="no"
              BUILD_DESKTOP="yes"
              DESKTOP_ENV_ARGS="DESKTOP_ENVIRONMENT=gnome DESKTOP_ENVIRONMENT_CONFIG_NAME=config_base DESKTOP_APPGROUPS_SELECTED="
              ;;
            desktop-mate)
              BUILD_MINIMAL="no"
              BUILD_DESKTOP="yes"
              DESKTOP_ENV_ARGS="DESKTOP_ENVIRONMENT=mate DESKTOP_ENVIRONMENT_CONFIG_NAME=config_base DESKTOP_APPGROUPS_SELECTED="
              ;;
          esac

          echo "=== Building Image: Release=$RELEASE, Flavour=$FLAVOUR ==="
          cd orangepi-build
          sudo ./build.sh \
            BOARD=orangepi4pro \
            BRANCH=next \
            BUILD_OPT=image \
            RELEASE=${RELEASE} \
            BUILD_MINIMAL=${BUILD_MINIMAL} \
            BUILD_DESKTOP=${BUILD_DESKTOP} \
            ${DESKTOP_ENV_ARGS}

          # Update boot.scr and boot configuration with device discovery and dual console
          BASE_IMG=$(find output/ -type f -name "*.img" | grep -v "nvme" | head -n 1)
          if [ -n "$BASE_IMG" ] && [ -f "$BASE_IMG" ]; then
            echo "=== BLOCK DEVICE DISCOVERY (SD Image) ==="
            LOOP_DEV=$(sudo losetup -fP --show "$BASE_IMG")
            ROOT_PART="${LOOP_DEV}p1"
            echo "Loop device: ${LOOP_DEV}"
            sudo blkid ${LOOP_DEV}* || true
            echo "Root partition: ${ROOT_PART}"
            sudo blkid -s PARTUUID -o value "${ROOT_PART}" || true

            sudo mkdir -p /mnt/sd-ci
            sudo mount "$ROOT_PART" /mnt/sd-ci
            [ -f ../boot/boot.cmd ] && sudo cp -v ../boot/boot.cmd /mnt/sd-ci/boot/
            [ -f ../boot/boot.scr ] && sudo cp -v ../boot/boot.scr /mnt/sd-ci/boot/
            sudo sync
            sudo umount /mnt/sd-ci
            sudo losetup -d "$LOOP_DEV"
            echo "=== END DISCOVERY (SD Image) ==="
          fi

      - name: Build SD Image (Arch Linux ARM)
        if: steps.check-kernel.outputs.should_skip != 'true' && github.event.inputs.reuse_run_id == '' && github.event.inputs.release == 'arch'
        run: |
          echo "=== Building Arch Linux ARM Rolling Image for Orange Pi 4 Pro ==="
          cd orangepi-build
          sudo ./build.sh \
            BOARD=orangepi4pro \
            BRANCH=next \
            BUILD_OPT=kernel \
            NO_HOST_RELEASE_CHECK=yes \
            EXPERT=yes

          mkdir -p arch_work
          cd arch_work
          TARGET_IMG="orangepi4pro-archlinux-arm64.img"
          truncate -s 4800M "$TARGET_IMG"

          parted -s "$TARGET_IMG" mklabel msdos
          parted -s "$TARGET_IMG" mkpart primary ext4 2048s 100%
          parted -s "$TARGET_IMG" set 1 boot on

          LOOP_DEV=$(sudo losetup -fP --show "$TARGET_IMG")
          ROOT_PART="${LOOP_DEV}p1"

          echo "=== BLOCK DEVICE DISCOVERY (Arch Linux) ==="
          echo "Loop device: ${LOOP_DEV}"
          sudo blkid ${LOOP_DEV}* || true
          echo "Root partition: ${ROOT_PART}"
          sudo blkid -s PARTUUID -o value "${ROOT_PART}" || true
          echo "=== END DISCOVERY ==="

          sudo mkfs.ext4 -F -L "ALARM_ROOT" -b 4096 "$ROOT_PART"
          mkdir -p rootfs
          sudo mount "$ROOT_PART" rootfs

          echo "[*] Downloading official Arch Linux ARM rootfs..."
          curl -L -o ArchLinuxARM-aarch64-latest.tar.gz "http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz"
          sudo bsdtar -xpf ArchLinuxARM-aarch64-latest.tar.gz -C rootfs

          mkdir -p rootfs/boot/dtb/allwinner/
          DTB_SRC=$(find ../ -type f -name "sun60i-a733-orangepi-4-pro.dtb" | head -1)
          if [ -n "$DTB_SRC" ] && [ -f "$DTB_SRC" ]; then
            sudo mkdir -p rootfs/boot/dtb/allwinner rootfs/boot/dtb/sunxi
            sudo cp -v "$DTB_SRC" rootfs/boot/dtb/allwinner/
            sudo ln -sf ../allwinner/sun60i-a733-orangepi-4-pro.dtb rootfs/boot/dtb/sunxi/sun60iw2p1-soc-system.dtb
            sudo ln -sf allwinner/sun60i-a733-orangepi-4-pro.dtb rootfs/boot/dtb/sun60iw2p1-soc-system.dtb
          fi

          [ -f ../boot/boot.cmd ] && sudo cp -v ../boot/boot.cmd rootfs/boot/
          [ -f ../boot/boot.scr ] && sudo cp -v ../boot/boot.scr rootfs/boot/
          [ -f ../boot/orangepiEnv.txt ] && sudo cp -v ../boot/orangepiEnv.txt rootfs/boot/

          K_IMG=$(find ../ -type f -name "Image" | head -1)
          if [ -n "$K_IMG" ] && [ -f "$K_IMG" ]; then
            sudo cp -v "$K_IMG" rootfs/boot/Image
          fi

          echo "archlinux-orangepi4pro" | sudo tee rootfs/etc/hostname
          sudo cp -rv ../overlay/* rootfs/ 2>/dev/null || true

          sudo sync
          sudo umount -lf rootfs
          sudo losetup -d "$LOOP_DEV"

          mkdir -p ../output/images/
          mv "$TARGET_IMG" ../output/images/
          cd ..

      - name: Generate NVMe SSD Image (PCIe NVMe Rootfs)
        if: steps.check-kernel.outputs.should_skip != 'true' && github.event.inputs.reuse_run_id == '' && (github.event.inputs.target_storage == 'nvme' || github.event.inputs.target_storage == 'both')
        run: |
          echo "=== Generating Standalone NVMe SSD Image ==="
          BASE_IMG=$(find orangepi-build/output/ -type f -name "*.img" | grep -v "nvme" | head -n 1)
          if [ -n "$BASE_IMG" ] && [ -f "$BASE_IMG" ]; then
            NVME_IMG="${BASE_IMG%.img}-nvme.img"
            echo "Converting $BASE_IMG to NVMe image: $NVME_IMG"
            cp -v "$BASE_IMG" "$NVME_IMG"

            LOOP=$(sudo losetup -Pf --show "$NVME_IMG")
            echo "=== BLOCK DEVICE DISCOVERY (NVMe Image) ==="
            echo "Loop device: ${LOOP}"
            sudo blkid ${LOOP}* || true
            sudo blkid -s PARTUUID -o value "${LOOP}p1" || true
            echo "=== END DISCOVERY ==="

            sudo mkdir -p /mnt/nvme-ci
            sudo mount "${LOOP}p1" /mnt/nvme-ci

            # Configure NVMe rootfs partition
            sudo sed -i 's|rootdev=.*|rootdev=/dev/nvme0n1p1|g' /mnt/nvme-ci/boot/orangepiEnv.txt || true
            sudo sed -i 's|/dev/mmcblk0p1|/dev/nvme0n1p1|g' /mnt/nvme-ci/etc/fstab || true

            sudo sync
            sudo umount /mnt/nvme-ci
            sudo losetup -d "$LOOP"
            echo "NVMe rootfs reconfiguration complete: $NVME_IMG"
          fi

      - name: Post-process SD image (Universal bootloader & rootdev fix)
        if: steps.check-kernel.outputs.should_skip != 'true' && github.event.inputs.reuse_run_id == ''
        run: |
          echo "=== Post-processing generated SD images ==="
          find orangepi-build/output/ -type f -name "*.img" | while read -r img; do
            echo "Patching image: $img"
            if [ -f "boot/bootloader-orangepi-4-pro.bin" ]; then
              echo "Writing bootloader to $img at sector 16..."
              dd if=boot/bootloader-orangepi-4-pro.bin of="$img" bs=512 seek=16 conv=notrunc
            fi
            LOOPDEV=$(sudo losetup -fP --show "$img")
            echo "Mounted $img on $LOOPDEV"
            mkdir -p /tmp/img_root
            sudo mount "${LOOPDEV}p1" /tmp/img_root
            if [ -f /tmp/img_root/boot/orangepiEnv.txt ]; then
              sudo sed -i 's/^rootdev=UUID=.*/rootdev=\/dev\/mmcblk0p1/' /tmp/img_root/boot/orangepiEnv.txt
              sudo sed -i 's/^rootdev=PARTUUID=.*/rootdev=\/dev\/mmcblk0p1/' /tmp/img_root/boot/orangepiEnv.txt
              if ! grep -q "console=" /tmp/img_root/boot/orangepiEnv.txt; then
                echo "console=both" | sudo tee -a /tmp/img_root/boot/orangepiEnv.txt
              fi
            fi
            if [ -f boot/boot.cmd ]; then
              sudo cp -vf boot/boot.cmd /tmp/img_root/boot/boot.cmd
              sudo cp -vf boot/boot.scr /tmp/img_root/boot/boot.scr
            fi
            sudo mkdir -p /tmp/img_root/etc/systemd/system/serial-getty@ttyS0.service.d
            printf '[Service]\nExecStart=\nExecStart=-/sbin/agetty -o "-p -- \\u" --autologin root --noclear -s %%I 115200 vt220\nStandardInput=tty\nStandardOutput=tty\n' | sudo tee /tmp/img_root/etc/systemd/system/serial-getty@ttyS0.service.d/autologin.conf
            sudo mkdir -p /tmp/img_root/etc/systemd/system/getty@tty1.service.d
            printf '[Service]\nExecStart=\nExecStart=-/sbin/agetty -o "-p -- \\u" --autologin root --noclear %%I 38400 linux\nStandardInput=tty\nStandardOutput=tty\n' | sudo tee /tmp/img_root/etc/systemd/system/getty@tty1.service.d/autologin.conf
            sudo mkdir -p /tmp/img_root/etc/systemd/system/getty.target.wants
            sudo ln -sf /lib/systemd/system/serial-getty@.service /tmp/img_root/etc/systemd/system/getty.target.wants/serial-getty@ttyS0.service
            sudo ln -sf /lib/systemd/system/getty@.service /tmp/img_root/etc/systemd/system/getty.target.wants/getty@tty1.service
            # Install bootsplash spinner daemon and service
            sudo mkdir -p /tmp/img_root/usr/local/bin
            sudo cp -vf overlay/usr/local/bin/a733-bootsplash-spinner /tmp/img_root/usr/local/bin/a733-bootsplash-spinner 2>/dev/null || true
            sudo chmod +x /tmp/img_root/usr/local/bin/a733-bootsplash-spinner 2>/dev/null || true
            sudo mkdir -p /tmp/img_root/etc/systemd/system/sysinit.target.wants
            sudo cp -vf overlay/etc/systemd/system/a733-bootsplash-spinner.service /tmp/img_root/etc/systemd/system/a733-bootsplash-spinner.service 2>/dev/null || true
            sudo ln -sf /etc/systemd/system/a733-bootsplash-spinner.service /tmp/img_root/etc/systemd/system/sysinit.target.wants/a733-bootsplash-spinner.service 2>/dev/null || true
            # Enable SSH service and socket explicitly
            sudo mkdir -p /tmp/img_root/etc/systemd/system/multi-user.target.wants
            sudo mkdir -p /tmp/img_root/etc/systemd/system/sockets.target.wants
            if [ -f /tmp/img_root/usr/lib/systemd/system/ssh.service ]; then
              sudo ln -sf /usr/lib/systemd/system/ssh.service /tmp/img_root/etc/systemd/system/multi-user.target.wants/ssh.service
            elif [ -f /tmp/img_root/lib/systemd/system/ssh.service ]; then
              sudo ln -sf /lib/systemd/system/ssh.service /tmp/img_root/etc/systemd/system/multi-user.target.wants/ssh.service
            fi
            if [ -f /tmp/img_root/usr/lib/systemd/system/ssh.socket ]; then
              sudo ln -sf /usr/lib/systemd/system/ssh.socket /tmp/img_root/etc/systemd/system/sockets.target.wants/ssh.socket
            elif [ -f /tmp/img_root/lib/systemd/system/ssh.socket ]; then
              sudo ln -sf /lib/systemd/system/ssh.socket /tmp/img_root/etc/systemd/system/sockets.target.wants/ssh.socket
            fi

            # Install drivers and ensure /etc/modules-load.d/a733-drivers.conf exists
            sudo mkdir -p /tmp/img_root/etc/modules-load.d
            printf 'maxio\nmotorcomm\naic8800_bsp\naic8800_fdrv\ncan\ncan_raw\ngs_usb\n' | sudo tee /tmp/img_root/etc/modules-load.d/a733-drivers.conf
            sync
            sudo umount /tmp/img_root
            sudo losetup -d "$LOOPDEV"
            echo "Successfully patched $img"
          done

      - name: Package artifacts
        if: steps.check-kernel.outputs.should_skip != 'true' && github.event.inputs.reuse_run_id == ''
        run: |
          mkdir -p release_artifacts
          echo "Looking for built images in orangepi-build/output/..."

          # 1. Compress and collect bootable disk image (.img)
          find orangepi-build/output/ -type f \( -name "*.img" -o -name "*.img.xz" \) | while read -r img; do
            echo "Processing image: $img"
            base=$(basename "$img")
            if [[ "$img" == *.xz ]]; then
              cp -v "$img" release_artifacts/
              (cd release_artifacts && sha256sum "$base" > "${base}.sha256")
            elif [[ "$img" == *.img ]]; then
              echo "Compressing $base with xz..."
              xz -T0 -9 -c "$img" > "release_artifacts/${base}.xz"
              (cd release_artifacts && sha256sum "${base}.xz" > "${base}.xz.sha256")
            fi
          done

          # 2. Collect generated kernel and u-boot deb packages
          if [ -d "orangepi-build/output/debs" ]; then
            echo "Collecting kernel and u-boot deb packages..."
            find orangepi-build/output/debs/ -type f -name "*.deb" | while read -r deb; do
              base=$(basename "$deb")
              # Rebrand orangepi deb package filenames to a733-allwinner
              target_name=$(echo "$base" | sed -e 's/^orangepi-/a733-allwinner-/' -e 's/orangepi4pro/a733-allwinner/g')
              cp -v "$deb" "release_artifacts/$target_name"
            done
          fi

          # 3. Generate master SHA256SUMS manifest
          (cd release_artifacts && sha256sum * > SHA256SUMS 2>/dev/null || true)

          echo "=== Release Artifacts Packaged ==="
          ls -lh release_artifacts/

          if [ -z "$(ls -A release_artifacts/ 2>/dev/null)" ]; then
            echo "ERROR: No release artifacts found!"
            find orangepi-build/output/ -maxdepth 4 -ls || true
            exit 1
          fi

          echo "### Packaged Release Assets" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh release_artifacts/ >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Image Artifact to CI
        if: steps.check-kernel.outputs.should_skip != 'true' && github.event.inputs.reuse_run_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: orangepi4pro-os-image
          path: release_artifacts/*
          if-no-files-found: error

      - name: Download existing artifacts (Reuse Run)
        if: steps.check-kernel.outputs.should_skip != 'true' && github.event.inputs.reuse_run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release_artifacts
          echo "Downloading artifacts from run ID: ${{ github.event.inputs.reuse_run_id }}"
          gh run download "${{ github.event.inputs.reuse_run_id }}" --dir release_artifacts/
          find release_artifacts/ -mindepth 2 -type f -exec mv -t release_artifacts/ {} +
          find release_artifacts/ -mindepth 1 -type d -exec rm -rf {} +
          ls -lh release_artifacts/

      - name: Publish GitHub Release
        if: steps.check-kernel.outputs.should_skip != 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.publish_release != false)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE_TAG=$(date -u +'%Y%m%d')
          DATE_STR=$(date -u +'%Y-%m-%d')
          REL="${{ github.event.inputs.release }}"
          [ -z "$REL" ] && REL="noble"
          FLAVOUR="${{ github.event.inputs.flavour }}"
          [ -z "$FLAVOUR" ] && FLAVOUR="minimal"

          TAG="${{ github.event.inputs.tag_name || 'daily' }}"
          TITLE="Orange Pi 4 Pro: ${REL^^} - ${FLAVOUR^^} (Daily Build - ${DATE_STR})"
          PRERELEASE_FLAG="--prerelease"

          cat << EOF > release_notes.md
          ## Orange Pi 4 Pro (Allwinner A733 / sun60iw2)

          **Release**: ${TITLE}
          **Target SoC**: Allwinner A733 (\`sun60iw2\`)
          **Kernel**: Mainline Linux 6.18.y (\`linux-6.18.y\`)
          **Distribution**: ${REL}
          **Flavour / Profile**: ${FLAVOUR}
          **Build Date**: ${DATE_STR}

          ### Default Credentials:
          - User: \`orangepi\` / \`orangepi\` (with sudo access)
          - Root: \`root\` / \`orangepi\`

          ### Features:
          - Automated block device discovery hooks in initramfs (\`blkid\`, \`partprobe\`, \`cat /proc/partitions\`)
          - Dual-console UART0 PB9/PB10 (\`console=ttyS0,115200\`) and HDMI (\`console=tty1\`) output
          - Out-of-tree drivers excluded from kernel image; proprietary drivers decoupled into standalone packages
          - \`cma=256M\` allocation and suspend/sleep targets permanently disabled for 24/7 stability

          ### Verification:
          Checksums are provided in \`SHA256SUMS\` and matching \`.sha256\` files for each asset.
          EOF
          sed -i 's/^[[:space:]]*//' release_notes.md

          UPSTREAM_KERNEL=$(git ls-remote https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git refs/heads/linux-6.18.y 2>/dev/null | awk '{print $1}' || echo "unknown")
          echo "<!-- BUILD_STAMP: KERNEL=${UPSTREAM_KERNEL} REPO=${GITHUB_SHA} -->" >> release_notes.md

          echo "Publishing release: tag=$TAG, title='$TITLE'..."
          set +e
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG does not exist, creating..."
            gh release create "$TAG" --title "$TITLE" --notes-file release_notes.md $PRERELEASE_FLAG
          fi

          echo "Updating release metadata for $TAG..."
          gh release edit "$TAG" --title "$TITLE" --notes-file release_notes.md $PRERELEASE_FLAG

          echo "Uploading release artifacts individually with retry..."
          UPLOAD_FAILED=0
          for asset in release_artifacts/*; do
            [ -f "$asset" ] || continue
            echo "Uploading $(basename "$asset")..."
            UPLOAD_SUCCESS=0
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$asset" --clobber 2>&1 | tee -a /tmp/release_upload.log; then
                UPLOAD_SUCCESS=1
                break
              fi
              echo "Upload failed (attempt $attempt/3), retrying in 5 seconds..."
              sleep 5
            done
            if [ $UPLOAD_SUCCESS -ne 1 ]; then
              echo "Failed to upload $asset after 3 attempts"
              UPLOAD_FAILED=1
            fi
          done
          RC=$UPLOAD_FAILED

          if [ $RC -ne 0 ]; then
            echo "### Release Publishing Encountered an Issue" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/release_upload.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $RC
          else
            echo "### Successfully Published Release: [$TAG](https://github.com/${{ github.repository }}/releases/tag/${TAG})" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Prune Redundant Images (Keep Last 3 Kernel Versions)
        if: steps.check-kernel.outputs.should_skip != 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.publish_release != false)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag_name || 'daily' }}
        run: |
          python3 - << 'PYEOF'
          import os, sys, json, re, urllib.request

          repo = os.environ.get('GH_REPO')
          tag = os.environ.get('TAG', 'daily')
          token = os.environ.get('GH_TOKEN')

          headers = {
              'Authorization': f'token {token}',
              'User-Agent': 'GitHub-Actions-Prune',
              'Accept': 'application/vnd.github.v3+json'
          }

          req = urllib.request.Request(f'https://api.github.com/repos/{repo}/releases/tags/{tag}', headers=headers)
          try:
              r = json.loads(urllib.request.urlopen(req).read().decode())
          except urllib.error.HTTPError as e:
              print(f"Release tag {tag} not found ({e}); skipping pruning.")
              sys.exit(0)

          assets = r.get('assets', [])
          img_versions = set()
          for a in assets:
              m = re.search(r'linux(6\.[0-9]+(?:\.[0-9]+)?)', a['name'])
              if m:
                  img_versions.add(m.group(1))

          def ver_key(v):
              parts = [int(p) for p in v.split('.')]
              while len(parts) < 3:
                  parts.append(0)
              return parts

          sorted_vers = sorted(img_versions, key=ver_key, reverse=True)
          keep_vers = set(sorted_vers[:3])
          print(f"[{tag}] Kernel versions in release: {sorted_vers}")
          print(f"[{tag}] Retaining last 3 versions: {keep_vers}")

          for a in assets:
              m = re.search(r'linux(6\.[0-9]+(?:\.[0-9]+)?)', a['name'])
              if m and m.group(1) not in keep_vers:
                  asset_id = a['id']
                  asset_name = a['name']
                  print(f"[{tag}] Pruning redundant asset {asset_name} (ID: {asset_id})...")
                  del_req = urllib.request.Request(f'https://api.github.com/repos/{repo}/releases/assets/{asset_id}', headers=headers, method='DELETE')
                  try:
                      urllib.request.urlopen(del_req)
                      print(f"[{tag}] Successfully deleted {asset_name}")
                  except Exception as err:
                      print(f"[{tag}] Failed to delete {asset_name}: {err}")
          PYEOF
